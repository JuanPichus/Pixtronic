<nav *ngIf="mostrarNavbar">
  <div class="nav-container">
    <div class="nav-brand">
      <h1>{{ title }}</h1>
    </div>
    
    <div class="nav-links">
      <a routerLink="/catalogo" routerLinkActive="active">Catálogo</a>
      <a routerLink="/carrito" routerLinkActive="active">Carrito</a>
    </div>

    <div class="nav-user" *ngIf="usuario$ | async as usuario">
      <span class="user-info">
        Cuenta: {{ usuario.admin ? 'Administrador' : 'Usuario' }}
        <br>
        <small>{{ usuario.username }}</small>
      </span>
      <button (click)="cerrarSesion()" class="btn-logout">Cerrar Sesión</button>
    </div>
  </div>
</nav>

<main [class.no-navbar]="!mostrarNavbar">
  <router-outlet></router-outlet>
</main>
